name: Auto Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Android Files
        run: |
          mkdir -p app/src/main/java/com/example/myvoiceai
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MyVoiceAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.example.myvoiceai'
            compileSdk 34
            defaultConfig {
              applicationId "com.example.myvoiceai"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application android:label="MyVoiceAI" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service android:name=".FloatingWebService" android:exported="false" android:foregroundServiceType="microphone" />
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myvoiceai/MainActivity.kt
          package com.example.myvoiceai
          import android.Manifest
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.webkit.*
          import android.widget.Button
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA), 1)
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER }
                  val btnFloat = Button(this).apply {
                      text = "Ekranda suzuvchi AI'ni yoqish"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              startForegroundService(Intent(this@MainActivity, FloatingWebService::class.java))
                              moveTaskToBack(true)
                          }
                      }
                  }
                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      addJavascriptInterface(AndroidBridge(this@MainActivity), "AndroidBridge")
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) { request.grant(request.resources) }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }
                  layout.addView(btnFloat)
                  layout.addView(webView, LinearLayout.LayoutParams(-1, -1))
                  setContentView(layout)
              }
          }

          class AndroidBridge(private val context: Context) {
              @JavascriptInterface
              fun toggleFlashlight(state: Boolean) {
                  try {
                      val cm = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.setTorchMode(cm.cameraIdList[0], state)
                  } catch (_: Exception) {}
              }
              @JavascriptInterface
              fun openApp(pkg: String) {
                  context.packageManager.getLaunchIntentForPackage(pkg)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(it)
                  }
              }
          }

          class FloatingWebService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var view: WebView
              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  val ch = NotificationChannel("ai", "AI", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  startForeground(1, Notification.Builder(this, "ai").setContentTitle("AI faol").setSmallIcon(android.R.drawable.ic_btn_speak_now).build())
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  view = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      addJavascriptInterface(AndroidBridge(this@FloatingWebService), "AndroidBridge")
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) { request.grant(request.resources) }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }
                  val params = WindowManager.LayoutParams(450, 520, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 50; y = 200
                  }
                  wm.addView(view, params)
              }
              override fun onDestroy() { super.onDestroy(); wm.removeView(view) }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVoiceAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
