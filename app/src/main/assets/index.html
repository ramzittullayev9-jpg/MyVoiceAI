<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shaxsiy Ovozli AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body {
    background: #0f172a; color: #f8fafc; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; padding: 20px;
  }
  .card {
    background: #1e293b; padding: 24px; border-radius: 24px; width: 100%; max-width: 360px;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .avatar-box {
    position: relative; width: 130px; height: 130px; margin: 0 auto 16px;
    border-radius: 50%; overflow: hidden; border: 4px solid #38bdf8;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .avatar-box.listening {
    border-color: #22c55e; box-shadow: 0 0 35px rgba(34, 197, 94, 0.8);
    animation: pulse 1.2s infinite;
  }
  .avatar-box.speaking {
    border-color: #a855f7; box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
  input[type="text"] {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #334155;
    background: #0f172a; color: white; font-size: 16px; text-align: center; margin-bottom: 12px;
  }
  .btn {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 15px;
    cursor: pointer; margin-bottom: 10px;
  }
  .btn-secondary { background: #334155; color: #f8fafc; }
  .status { font-size: 14px; color: #94a3b8; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>

<div class="card">
  <div class="avatar-box" id="aiOrb" onclick="startVoice()">
    <img id="avatarImg" src="https://flaticon.com" alt="AI">
  </div>

  <input type="text" id="aiNameInput" placeholder="AI ismini yozing (masalan: Barno)" onchange="saveSettings()">

  <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="loadAvatar(event)">
  <button class="btn btn-secondary" onclick="document.getElementById('galleryInput').click()">
    🖼️ Galereyadan rasm tanlash
  </button>

  <button class="btn" onclick="startVoice()">🎙️ Gaplashish (Bosing)</button>

  <div class="status" id="statusText">Gaplashish uchun rasmni bosing</div>
</div>

<script>
  const orb = document.getElementById("aiOrb");
  const statusText = document.getElementById("statusText");
  const nameInput = document.getElementById("aiNameInput");
  const avatarImg = document.getElementById("avatarImg");

  window.onload = () => {
    const savedName = localStorage.getItem("ai_name") || "Yordamchi";
    const savedImg = localStorage.getItem("ai_avatar");
    nameInput.value = savedName;
    if (savedImg) avatarImg.src = savedImg;
  };

  function saveSettings() {
    localStorage.setItem("ai_name", nameInput.value.trim() || "Yordamchi");
  }

  function loadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      avatarImg.src = reader.result;
      localStorage.setItem("ai_avatar", reader.result);
      if (window.AndroidBridge) window.AndroidBridge.updateAvatar(reader.result);
    };
    reader.readAsDataURL(file);
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = SpeechRecognition ? new SpeechRecognition() : null;

  if (recognition) {
    recognition.lang = "uz-UZ";
    recognition.interimResults = false;

    recognition.onstart = () => {
      orb.className = "avatar-box listening";
      statusText.innerText = "Eshitmoqdaman, gapiring...";
    };

    recognition.onresult = (event) => {
      const userSpeech = event.results[0][0].transcript;
      statusText.innerText = "Siz: " + userSpeech;
      processCommand(userSpeech);
    };

    recognition.onerror = () => {
      orb.className = "avatar-box";
      statusText.innerText = "Ovoz eshitilmadi, qayta bosing";
    };
  }

  function startVoice() {
    window.speechSynthesis.cancel();
    if (!recognition) {
      alert("Qurilmangizda ovoz tanish qo'llab-quvvatlanmaydi");
      return;
    }
    try { recognition.start(); } catch (e) {}
  }

  async function processCommand(text) {
    const q = text.toLowerCase();
    orb.className = "avatar-box";

    if (q.includes("chiroq") && q.includes("yoq")) {
      if (window.AndroidBridge) window.AndroidBridge.toggleFlashlight(true);
      speak("Chiroq yoqildi");
      return;
    }
    if (q.includes("chiroq") && (q.includes("o'chir") || q.includes("ochir"))) {
      if (window.AndroidBridge) window.AndroidBridge.toggleFlashlight(false);
      speak("Chiroq o'chirildi");
      return;
    }
    if (q.includes("telegram") && q.includes("och")) {
      if (window.AndroidBridge) window.AndroidBridge.openApp("org.telegram.messenger");
      speak("Telegram ochildi");
      return;
    }
    if (q.includes("youtube") && q.includes("och")) {
      if (window.AndroidBridge) window.AndroidBridge.openApp("com.google.android.youtube");
      speak("YouTube ochildi");
      return;
    }

    statusText.innerText = "O'ylamoqdaman...";
    const aiName = localStorage.getItem("ai_name") || "Yordamchi";

    try {
      const response = await fetch("https://pollinations.ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            {
              role: "system",
              content: `Sening isming ${aiName}. Sen foydalanuvchining shaxsiy ovozli yordamchisisan va hamma narsani bilasan. Hech qanday belgilar (*, #, -) ishlatma, chunki javobing ovozda o'qiladi. Qisqa, aniq va tabiiy o'zbek tilida javob ber.`
            },
            { role: "user", content: text }
          ],
          model: "openai"
        })
      });

      const reply = await response.text();
      statusText.innerText = reply;
      speak(reply);
    } catch (err) {
      speak("Internet bilan bog'lanishda xatolik yuz berdi");
    }
  }

  function speak(message) {
    const utterance = new SpeechSynthesisUtterance(message);
    utterance.lang = "uz-UZ";
    utterance.rate = 1.0;

    utterance.onstart = () => { orb.className = "avatar-box speaking"; };
    utterance.onend = () => {
      orb.className = "avatar-box";
      statusText.innerText = "Yana savol berish uchun rasmni bosing";
    };

    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>
